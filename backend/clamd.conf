##
## MALGUARD AI — High-Performance ClamAV Daemon Configuration
## Tuned specifically for Vercel Container Runtime (2 GB RAM Limit)
##

# Internal TCP socket (restricted strictly to container loopback)
TCPSocket 3310
TCPAddr 127.0.0.1

# Concurrency & Worker Threads
# Limits thread contexts to keep memory footprint under control
MaxThreads 2
MaxQueue 5

# Memory Optimization & Payload Limits
# Strictly limits memory allocated per stream scan
StreamMaxLength 15M
MaxScanSize 30M
MaxFileSize 15M
PCREMaxFileSize 10M
MaxRecursion 10
MaxFiles 1000

# Critical Memory Safeguard: Prevent loading 2 copies of database simultaneously
ConcurrentDatabaseReload no

# In immutable containers, disable automatic periodic reloads to avoid CPU/RAM spikes
SelfCheck 0

# Security and Engine Settings
Bytecode yes
BytecodeSecurity TrustSigned
LeaveTemporaryFiles no
FixStaleSocket yes
FollowDirectorySymlinks no
FollowFileSymlinks no

# Logging & Process Tracking
LogFile /tmp/clamav.log
LogTime yes
LogVerbose no
PidFile /tmp/clamd.pid
